[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprof-btp"
version = "0.1.0"
description = "Learn and select resource profiles for repeated coding workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentprof = "agentprof.cli:main"

[tool.setuptools.packages.find]
include = ["agentprof*", "benchmarks*"]
